<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema de Lembrete Acadêmico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell container">
    <section class="auth-card shadow-lg">
      <div class="brand-block text-center mb-4">
        <img src="logo-icon.png" class="brand-logo" alt="Sistema de Lembrete Acadêmico">
        <p class="brand-kicker mb-1">Sistema de Lembrete Acadêmico</p>
        <h1 class="h3 fw-bold mb-0">Acesse sua conta</h1>
      </div>
      <form id="loginForm" class="needs-validation" novalidate>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="seuemail@gmail.com" required>
          <label for="email">E-mail</label>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="senha" placeholder="Senha" required minlength="4">
          <label for="senha">Senha</label>
          <div class="invalid-feedback">Informe sua senha.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
          <div class="form-check text-start">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Lembrar-me</label>
          </div>
          <span class="small text-secondary">Versão 2026</span>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
      </form>
      <p class="mt-4 mb-0 text-center text-secondary">Não tem uma conta? <a href="cadastro.html" class="link-light fw-semibold text-decoration-none">Cadastre-se</a></p>
    </section>
  </main>
  <footer class="team-footer auth-footer">
    <span>Equipe:</span>
    <strong>Guilherme</strong>
    <strong>Leonardo</strong>
    <strong>Lucas</strong>
    <strong>Rafael</strong>
    <strong>Thiago</strong>
  </footer>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
