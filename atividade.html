<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Nova Atividade</title>

<style>
.card{
    max-width: 600px;
    margin: auto;
}
</style>

</head>

<body class="bg-body-tertiary d-flex align-items-center" style="min-height:100vh;">

<div class="container">

  <div class="card shadow-lg p-4">

    <!-- TOPO -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Nova Atividade</h4>
      <a href="dashboard.html" class="btn btn-outline-light">⬅ Dashboard</a>
    </div>

    <!-- FORM -->
    <form onsubmit="salvarAtividade(event)">

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="titulo" placeholder="Título" required>
        <label for="titulo">Título</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="disciplina" placeholder="Disciplina" required>
        <label for="disciplina">Disciplina</label>
      </div>

      <div class="form-floating mb-3">
        <textarea class="form-control" id="descricao" placeholder="Descrição" style="height:100px"></textarea>
        <label for="descricao">Descrição</label>
      </div>

      <div class="form-floating mb-3">
        <input type="date" class="form-control" id="dataEntrega" required>
        <label for="dataEntrega">Data de entrega</label>
      </div>

      <div class="form-floating mb-4">
        <select class="form-select" id="prioridade" required>
          <option value="">Selecione</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
        <label for="prioridade">Prioridade</label>
      </div>

      <button class="btn btn-success w-100 py-2">Salvar atividade</button>

      <!-- BOTÃO EXTRA -->
      <p class="mt-3 text-center">
        <a href="dashboard.html" class="btn btn-outline-primary w-100">Ver atividades</a>
      </p>

    </form>

  </div>

</div>

<script>
let editIndex = localStorage.getItem("editarIndex");

window.onload = function(){
    if(editIndex !== null){
        let atividades = JSON.parse(localStorage.getItem("atividades")) || [];
        let atividade = atividades[editIndex];

        document.getElementById("titulo").value = atividade.titulo;
        document.getElementById("disciplina").value = atividade.disciplina;
        document.getElementById("descricao").value = atividade.descricao;
        document.getElementById("dataEntrega").value = atividade.data;
        document.getElementById("prioridade").value = atividade.prioridade;

        document.querySelector("h4").innerText = "Editar Atividade";
    }
}

function salvarAtividade(event){
    event.preventDefault();

    let atividades = JSON.parse(localStorage.getItem("atividades")) || [];

    const atividade = {
        titulo: document.getElementById("titulo").value,
        disciplina: document.getElementById("disciplina").value,
        descricao: document.getElementById("descricao").value,
        data: document.getElementById("dataEntrega").value,
        prioridade: document.getElementById("prioridade").value
    };

    if(editIndex !== null){
        atividades[editIndex] = atividade;
        localStorage.removeItem("editarIndex");
        alert("Atividade atualizada com sucesso!");
    } else {
        atividades.push(atividade);
        alert("Atividade cadastrada com sucesso!");
    }

    localStorage.setItem("atividades", JSON.stringify(atividades));

    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
