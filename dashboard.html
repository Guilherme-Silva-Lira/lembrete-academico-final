<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Dashboard</title>

<style>
.card:hover{
    transform: scale(1.02);
    transition: 0.3s;
}
</style>

</head>

<body class="bg-body-tertiary">

<div class="container py-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-0">Dashboard</h3>
      <small class="text-secondary">Bem-vindo, Guilherme 👋</small>
    </div>

    <div>
      <a href="atividade.html" class="btn btn-success me-2">+ Nova atividade</a>
      <a href="login.html" class="btn btn-outline-light">Sair</a>
    </div>
  </div>

  <!-- ALERTA -->
  <div id="alertaProximo" class="alert alert-warning d-none"></div>

  <!-- RESUMO -->
  <div class="row mb-4">

    <div class="col-md-4">
      <div class="card text-center p-3 shadow-sm bg-primary text-white">
        <h6>Total</h6>
        <h3 id="total">0</h3>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center p-3 shadow-sm bg-warning text-dark">
        <h6>Pendentes</h6>
        <h3 id="pendentes">0</h3>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-center p-3 shadow-sm bg-danger text-white">
        <h6>Atrasadas</h6>
        <h3 id="atrasadas">0</h3>
      </div>
    </div>

  </div>

  <!-- TOP 5 -->
  <h5 class="mb-3">⏳ Próximas atividades</h5>
  <div class="row mb-4" id="topAtividades"></div>

  <!-- LISTA -->
  <h5 class="mb-3">📋 Todas as atividades</h5>
  <div class="row" id="listaAtividades"></div>

  <!-- VAZIO -->
  <div id="semAtividades" class="text-center mt-5 d-none">
    <h5 class="text-secondary">Nenhuma atividade cadastrada 😢</h5>
    <a href="atividade.html" class="btn btn-primary mt-3">Criar primeira atividade</a>
  </div>

</div>

<script>
function formatarData(data){
    return new Date(data).toLocaleDateString('pt-BR');
}

function estaAtrasada(data){
    let hoje = new Date();
    let entrega = new Date(data);
    hoje.setHours(0,0,0,0);
    return entrega < hoje;
}

function verificarProximas(atividades){
    let hoje = new Date();
    let aviso = document.getElementById("alertaProximo");

    let proximas = atividades.filter(a => {
        let data = new Date(a.data);
        let diff = (data - hoje) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 2;
    });

    if(proximas.length > 0){
        aviso.classList.remove("d-none");
        aviso.innerHTML = `⚠️ Você tem ${proximas.length} atividade(s) próxima(s) do prazo!`;
    }
}

function excluirAtividade(index){
    let atividades = JSON.parse(localStorage.getItem("atividades")) || [];

    if(confirm("Deseja excluir esta atividade?")){
        atividades.splice(index, 1);
        localStorage.setItem("atividades", JSON.stringify(atividades));
        carregarAtividades();
    }
}

function editarAtividade(index){
    localStorage.setItem("editarIndex", index);
    window.location.href = "atividade.html";
}

function atualizarResumo(atividades){
    let total = atividades.length;
    let atrasadas = atividades.filter(a => estaAtrasada(a.data)).length;
    let pendentes = total - atrasadas;

    document.getElementById("total").innerText = total;
    document.getElementById("pendentes").innerText = pendentes;
    document.getElementById("atrasadas").innerText = atrasadas;
}

function renderTop5(atividades){
    let container = document.getElementById("topAtividades");

    let ordenadas = [...atividades]
        .sort((a,b) => new Date(a.data) - new Date(b.data))
        .slice(0,5);

    container.innerHTML = "";

    ordenadas.forEach(a => {
        container.innerHTML += `
        <div class="col-12 col-md-6 col-lg-3 mb-2">
            <div class="card p-2 shadow-sm">
                <strong>${a.titulo}</strong>
                <small>${formatarData(a.data)}</small>
            </div>
        </div>
        `;
    });
}

function carregarAtividades(){
    let atividades = JSON.parse(localStorage.getItem("atividades")) || [];

    let container = document.getElementById("listaAtividades");
    let vazio = document.getElementById("semAtividades");

    container.innerHTML = "";

    if(atividades.length === 0){
        vazio.classList.remove("d-none");
        return;
    }

    atualizarResumo(atividades);
    renderTop5(atividades);
    verificarProximas(atividades);

    atividades.forEach((atividade, index) => {

        let cor = "secondary";
        let texto = "";

        if(atividade.prioridade === "alta"){
            cor = "danger";
            texto = "Alta";
        }
        if(atividade.prioridade === "media"){
            cor = "warning";
            texto = "Média";
        }
        if(atividade.prioridade === "baixa"){
            cor = "success";
            texto = "Baixa";
        }

        let atrasada = estaAtrasada(atividade.data);

        let card = `
        <div class="col-12 col-md-6 col-lg-4 mb-4">
            <div class="card shadow-lg h-100 border-${atrasada ? 'danger' : cor}">
                <div class="card-body d-flex flex-column">

                    <h5>
                        ${atividade.titulo}
                        ${atrasada ? '<span class="badge bg-danger ms-2">Atrasada</span>' : ''}
                    </h5>

                    <p class="text-secondary">${atividade.descricao}</p>

                    <div class="mt-auto">
                        <p><strong>Disciplina:</strong> ${atividade.disciplina}</p>
                        <p><strong>Entrega:</strong> ${formatarData(atividade.data)}</p>

                        <span class="badge bg-${cor}">${texto}</span>

                        <div class="mt-3 d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-warning" onclick="editarAtividade(${index})">✏️ Editar</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="excluirAtividade(${index})">🗑️ Excluir</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        `;

        container.innerHTML += card;
    });
}

carregarAtividades();
</script>

</body>
</html>
