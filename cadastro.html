<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Sistema de Lembrete Acadêmico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell container">
    <section class="auth-card shadow-lg auth-card-wide">
      <div class="brand-block text-center mb-4">
        <img src="logo-icon.png" class="brand-logo" alt="Sistema de Lembrete Acadêmico">
        <p class="brand-kicker mb-1">Sistema de Lembrete Acadêmico</p>
        <h1 class="h3 fw-bold mb-0">Criar conta</h1>
      </div>
      <form id="cadastroForm" class="needs-validation" novalidate>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="nome" placeholder="Seu nome" required minlength="3">
          <label for="nome">Nome completo</label>
          <div class="invalid-feedback">Informe seu nome completo.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="seuemail@gmail.com" required>
          <label for="email">E-mail</label>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>
        <div class="row g-3">
          <div class="col-md-6"><div class="form-floating mb-3"><input type="password" class="form-control" id="senha" placeholder="Senha" required minlength="4"><label for="senha">Senha</label><div class="invalid-feedback">Use pelo menos 4 caracteres.</div></div></div>
          <div class="col-md-6"><div class="form-floating mb-3"><input type="password" class="form-control" id="confirmarSenha" placeholder="Confirmar senha" required minlength="4"><label for="confirmarSenha">Confirmar senha</label><div class="invalid-feedback">Confirme sua senha.</div></div></div>
        </div>
        <button class="btn btn-success w-100 btn-lg" type="submit"><i class="bi bi-person-check me-2"></i>Cadastrar</button>
      </form>
      <p class="mt-4 mb-0 text-center text-secondary">Já possui uma conta? <a href="index.html" class="link-light fw-semibold text-decoration-none">Entrar</a></p>
    </section>
  </main>
  <footer class="team-footer auth-footer">
    <span>Equipe:</span>
    <strong>Guilherme</strong>
    <strong>Leonardo</strong>
    <strong>Lucas</strong>
    <strong>Rafael</strong>
    <strong>Thiago</strong>
  </footer>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
